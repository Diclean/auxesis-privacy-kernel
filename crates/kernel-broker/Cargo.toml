[package]
name = "auxesis-kernel-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Tool permission broker with taint tracking, log redaction and an audit trail for the Auxesis privacy kernel."
keywords = ["permissions", "sandbox", "audit", "taint"]
categories = ["security", "development-tools"]
exclude = ["tests/**"]

[lib]
# Package rename only: the library stays kernel_broker for every `use` site.
name = "kernel_broker"

[dependencies]
kernel-core = { package = "auxesis-kernel-core", path = "../kernel-core", version = "0.1.5" }
kernel-net = { package = "auxesis-kernel-net", path = "../kernel-net", version = "0.1.5" }
# Owner-identifier guard on outbound text (owner_ids.rs): the recognisers only.
kernel-privacy = { package = "auxesis-kernel-privacy", path = "../kernel-privacy", version = "0.1.5" }
aho-corasick = "1"
async-trait = "0.1"
base64 = "0.23"
libc = "0.2"
serde.workspace = true
# Approval-edit audit: SHA-256 of the requested and the executed arguments,
# so the journal can name both without ever storing the arguments themselves.
sha2 = "0.11.1"
# B4-01/B4-02: the scrub layer must never rewrite non-secret JSON. With
# `arbitrary_precision` a `Value` keeps each number's original lexeme
# (`u64::MAX`, `1e22`, `0.1`, … bytes-exact), and `preserve_order` keeps
# object keys in input order instead of sorting them through a BTreeMap.
# Cargo unifies these features for every crate that reaches kernel-broker
# (the CLI and daemon), so the whole structured layer sees them.
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process", "time", "io-util", "net", "sync"] }
tracing.workspace = true
# R8: real NFKC (ligatures, compat forms, combining marks) for the
# exact-value layer, with per-char offset mapping.
unicode-normalization = "0.1"
zeroize = "1"

[features]
# Enables `ShellSandbox::with_test_sandbox_exec`, the only way to point the
# shell at another helper binary. It exists solely so *other crates' test
# targets* can reach the fail-closed path; `cfg(test)` cannot cross a crate
# boundary. Enable it only from a `[dev-dependencies]` edge, never from a
# production `[dependencies]` edge.
test-util = []

[dev-dependencies]
# Enable `MemoryAuditSink` for this crate's own integration tests (the
# `test-util` feature; `cfg(test)` does not cross a crate boundary).
kernel-broker = { package = "auxesis-kernel-broker", path = ".", features = ["test-util"] }
# Re-state the `kernel-net` edge with its loopback test feature so this
# crate's own tests can reach a loopback `wiremock` server. A dev-dependency
# edge is never enabled for production builds.
kernel-net = { package = "auxesis-kernel-net", path = "../kernel-net", features = ["testing"] }
rusqlite.workspace = true
tempfile.workspace = true
wiremock = "0.6"

[package]
name = "auxesis-kernel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Privacy modes, egress paths, grants and shared plumbing for the Auxesis privacy kernel."
keywords = ["privacy", "egress", "policy", "pii"]
categories = ["security", "config"]
exclude = ["tests/**"]

[lib]
# Package rename only: the library stays kernel_core for every `use` site.
name = "kernel_core"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
# Case/normalisation-insensitive path comparison for the sandbox guard
# (APFS/HFS+ are both; J-02 breaker round 2).
unicode-normalization = "0.1"
# WHATWG URL parsing shared by the clients and `aux doctor` (J-02 round 3).
url = "2"

[target.'cfg(unix)'.dependencies]
# The passwd-database lookup behind `keychain::os_home` and the sandbox
# tripwire (never `$HOME`; J-02) needs libc.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS preferred languages (`i18n::system_language_tags`): launchd gives
# the daemon no `LANG`. Both crates are already in the lock through the TLS
# stack; `core-foundation-sys` is the one that exposes `CFLocale`.
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
chrono-tz = "0.10"
tempfile.workspace = true

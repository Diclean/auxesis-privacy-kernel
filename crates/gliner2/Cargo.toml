[package]
name = "auxesis-gliner2"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "GLiNER2 zero-shot span extraction over ONNX Runtime, with byte offsets into the text."
keywords = ["gliner", "ner", "onnx", "entity-extraction"]
categories = ["artificial-intelligence", "text-processing"]
exclude = ["tests/**"]

[lib]
# `gliner2-rs` is taken on crates.io; the package is auxesis-gliner2 and the
# library keeps the name every `use gliner2_rs::…` already expects.
name = "gliner2_rs"

[dependencies]
# ONNX Runtime bindings. `load-dynamic` resolves the ONNX Runtime 1.20 shared
# library at run time (`ORT_DYLIB_PATH` or `Options::ort_dylib`), so the build
# downloads nothing. The version is the one the lock already held.
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic"] }
regex = "1"
# Word offsets and subword ids come from the fast tokenizer the graph was
# exported with. `onig` is the regex backend the lock already holds.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

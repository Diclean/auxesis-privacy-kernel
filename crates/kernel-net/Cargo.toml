[package]
name = "auxesis-kernel-net"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "The one HTTP client factory, with an SSRF guard, DNS pinning and an egress allow-list, for the Auxesis privacy kernel."
keywords = ["http-client", "ssrf", "egress", "privacy"]
categories = ["network-programming", "security"]
exclude = ["tests/**"]

[lib]
# Package rename only: the library stays kernel_net for every `use` site.
name = "kernel_net"

[dependencies]
async-trait = "0.1"
kernel-core = { package = "auxesis-kernel-core", path = "../kernel-core", version = "0.1.5" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.11.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "net", "io-util", "sync"] }

[features]
# Enables the loopback-address test fetchers. It exists solely so *other
# crates' test targets* can reach a loopback `wiremock` server; `cfg(test)`
# alone cannot cross a crate boundary. It must only ever be enabled from a
# `[dev-dependencies]` edge, never from a production `[dependencies]` edge —
# loopback bypasses the SSRF address guard.
testing = []

[dev-dependencies]
libc = "0.2"
log = "0.4"
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
wiremock = "0.6"

[lints]
workspace = true

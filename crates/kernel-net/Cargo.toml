[package]
name = "kernel-net"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
kernel-core = { path = "../kernel-core" }
html5ever = "0.39"
markup5ever_rcdom = "0.39"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "net", "io-util", "sync"] }

[features]
# Enables the loopback-address test fetchers. It exists solely so *other
# crates' test targets* can reach a loopback `wiremock` server; `cfg(test)`
# alone cannot cross a crate boundary. It must only ever be enabled from a
# `[dev-dependencies]` edge, never from a production `[dependencies]` edge —
# loopback bypasses the SSRF address guard.
testing = []

[dev-dependencies]
libc = "0.2"
log = "0.4"
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
wiremock = "0.6"

[lints]
workspace = true

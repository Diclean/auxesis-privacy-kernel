[package]
name = "auxesis-kernel-privacy"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Deterministic detection and restorable tokenisation of sensitive values in text that leaves the machine."
keywords = ["pii", "redaction", "privacy", "anonymisation", "masking"]
categories = ["security", "text-processing"]
exclude = ["tests/**"]

[lib]
# Package rename only: the library stays kernel_privacy for every `use` site.
name = "kernel_privacy"

[features]
default = []
# Local GLiNER2-PII NER recogniser (slice 1d). The model is loaded
# at runtime from a user-configured local path; nothing is bundled and no Python
# runs. ONNX Runtime is loaded dynamically (`load-dynamic`) from a dylib the
# user points at with `ORT_DYLIB_PATH` (or `GlinerConfig::ort_dylib`); see
# `crates/gliner2/README.md` and `scripts/export-gliner2-onnx.py`.
ner-gliner = ["dep:gliner2-rs"]
# Lets a dependent inject a detector in its own tests (`Gate::for_tests`).
# Only `[dev-dependencies]` turn it on; production gates never can.
test-util = []

[dependencies]
# Aho-Corasick automaton for the local contact index (slice 1f): one linear
# scan matches every known name. Already in the lock file through `regex`.
aho-corasick = "1"
# Verified home handle for the vault. Every vault write goes through its
# directory descriptor, the write-gateway rule for paths under the home.
# Also used by the `[privacy] mask_first_names` contract test.
kernel-core = { package = "auxesis-kernel-core", path = "../kernel-core", version = "0.1.9" }
# Keyed pseudonyms for the anonymizer: a per-session HMAC-SHA-256 of the
# normalised value, never a plain hash.
hmac = "0.13"
regex = "1"
serde.workspace = true
serde_json = "1"
sha2 = "0.11.1"
thiserror.workspace = true
# NFKC folding of a value before it is HMAC'd, so visually identical
# identifiers share one token.
unicode-normalization = "0.1"
# Contact strings (names, addresses, phones, IBANs) are held in `Zeroizing`
# buffers, so the index wipes them when it drops them (slice 1f). Already in the
# lock file through the crypto crates.
zeroize = "1"
# The GLiNER2 runner (crates/gliner2): ONNX Runtime through `ort` with
# `load-dynamic`, so the build needs no network and no ONNX Runtime library.
gliner2-rs = { package = "auxesis-gliner2", path = "../gliner2", version = "0.1.9", optional = true }
# Encrypted session vault: AES-256-GCM seals each session's
# token map, and `getrandom` supplies the key and nonces. Both already sit in the
# lock through other crates, so this adds no new implementation to the tree.
# (`zeroize`, declared above, also wipes the vault's keys and values.)
aes-gcm = "0.11.1"
getrandom = "0.2"

[dev-dependencies]
# The JSONL corpus readers (the `qa/privacy-eval` runner, `examples/` and the
# golden tests) are the JSON consumers; keeping them dev-only keeps the library's
# public API serde-free.
serde.workspace = true
serde_json = "1"
tempfile.workspace = true
toml.workspace = true
proptest.workspace = true

[[example]]
name = "ner_eval"
required-features = ["ner-gliner"]

[[example]]
name = "public_eval"

[lints]
workspace = true

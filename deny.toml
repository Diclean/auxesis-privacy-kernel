# cargo-deny policy: `cargo deny check`. Every licence in the dependency graph
# must be on this allow-list before a dependency is accepted.

[graph]
all-features = true

[advisories]
yanked = "deny"
# RUSTSEC-2024-0436: `paste` 1.0.15 is unmaintained (no fixed release). It
# reaches this graph only through `tokenizers 0.21.4`, a transitive dependency
# of the optional `ner-gliner` feature. Updating tokenizers beyond 0.21.4 is a
# separate dependency decision, so the advisory is ignored until 2027-06-30
# rather than left failing every build. cargo-deny 0.20 has no absolute
# per-ignore expiry, so the CI "advisory ignore expiry" step enforces the date.
# Expires: 2027-06-30
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained and has no fixed release; reached only via tokenizers 0.21.4 (auxesis-gliner2, optional ner-gliner feature), and a tokenizers major update is a separate decision" },
]

[licenses]
# The allow-list below covers third-party dependencies only. The project's own
# crates are licensed under PolyForm Noncommercial 1.0.0 and are allowed by the
# per-crate exceptions under [licenses.exceptions], never here: a third-party
# dependency that ships under PolyForm Noncommercial is not accepted.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "CC0-1.0",
]
confidence-threshold = 0.9

# Our own crates. PolyForm Noncommercial 1.0.0 is the licence of this
# repository (see LICENSE), so the workspace crates are allowed that licence
# and nothing else. Every entry names one crate of this repository: a
# dependency under the same licence stays rejected.
[[licenses.exceptions]]
crate = "auxesis-gliner2"
allow = ["PolyForm-Noncommercial-1.0.0"]
[[licenses.exceptions]]
crate = "auxesis-kernel-broker"
allow = ["PolyForm-Noncommercial-1.0.0"]
[[licenses.exceptions]]
crate = "auxesis-kernel-core"
allow = ["PolyForm-Noncommercial-1.0.0"]
[[licenses.exceptions]]
crate = "auxesis-kernel-mcp"
allow = ["PolyForm-Noncommercial-1.0.0"]
[[licenses.exceptions]]
crate = "auxesis-kernel-net"
allow = ["PolyForm-Noncommercial-1.0.0"]
[[licenses.exceptions]]
crate = "auxesis-kernel-privacy"
allow = ["PolyForm-Noncommercial-1.0.0"]
[[licenses.exceptions]]
crate = "privacy-eval"
allow = ["PolyForm-Noncommercial-1.0.0"]

[licenses.private]
# The private crates of this workspace (the ones with `publish = false`) are
# checked too: they carry the same licence as the published crates.
ignore = false

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

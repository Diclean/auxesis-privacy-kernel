[package]
name = "privacy-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Scores the detectors against the JSONL corpus in `cases/`. It is its own
# package so the `kernel-privacy` library stays free of the benchmark driver.
kernel-core = { package = "auxesis-kernel-core", path = "../../crates/kernel-core" }
kernel-privacy = { package = "auxesis-kernel-privacy", path = "../../crates/kernel-privacy" }
serde.workspace = true
serde_json = "1"
# Checks the hash header of the frozen Tier C set (`heldout-2.jsonl`); the
# kernel crates already pin this version, so the lock gains no package.
sha2 = "0.10"

[features]
# Deep detection is the GLiNER feature of `kernel-privacy`.
# It is on by default so the detection table measures it when the model files are
# installed; the model and the ONNX Runtime dylib are discovered at runtime and
# the Deep rows print NOT MEASURED when they are absent.
default = ["ner-gliner"]
ner-gliner = ["kernel-privacy/ner-gliner"]

[lints]
workspace = true

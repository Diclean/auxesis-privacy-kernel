# LEAK-FINDER-1 settings, read by tests/leak_finder.rs (scripts/leak-finder.sh).
# `<key> <value>` sets a run setting; `leak-finder.override` (never committed)
# can set the same keys for one run.
cases 2000000
seed 20261022
# Safety abort only, never the shape of the run: the case set is planned from
# `seed` and `cases` up front, and a run this stops short says `truncated`.
max_secs 1080

# Known accepted gaps: `allow <class> <mutator[,mutator...]> <reason>`.
# `*` matches anything; a pair cell (`a+b`) is allowed only when the pair
# itself is listed, or when every half is listed on its own, so one parked
# mutator never parks the leaks of the other half of a pair.
# Allowed cells stay in the JSON report but are left out of the totals.
allow name * names are not hidden (owner 2026-10-19); not seeded, listed for the record
allow dob * dates of birth are not an always-hidden class; not seeded, listed for the record
allow * homoglyph Cyrillic and Greek look-alikes are Cyrillic prose, out of scope (private-mode languages)
allow card sep-dot,sep-slash,sep-tab,sep-nbsp,sep-figure,sep-zw,lf,crlf,fullwidth,entities,glue-pre,glue-suf cards beyond Luhn plain numbers are a parked gap (bank statements, not cards)

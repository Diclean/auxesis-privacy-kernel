[workspace]
resolver = "2"
members = [
    "crates/kernel-core",
    "crates/gliner2",
    "crates/kernel-privacy",
    "crates/kernel-broker",
    "crates/kernel-net",
    "crates/kernel-mcp",
    "qa/privacy-eval",
]
# The quickstart builds on the privacy crate alone.
default-members = ["crates/kernel-privacy"]

[workspace.package]
version = "0.1.11"
edition = "2021"
authors = ["The Auxesis kernel authors"]
license = "Apache-2.0"
# The SPDX expression above is the licence cargo-deny and crates.io read. The
# `license-file` line below adds the verbatim text to every published
# package: cargo copies it into the .crate, so the terms travel with the
# code. Both lines are inherited by every crate of this workspace.
license-file = "LICENSE"
repository = "https://github.com/Diclean/auxesis-privacy-kernel"
rust-version = "1.99"

[workspace.dependencies]
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.39", features = ["bundled-sqlcipher", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "0.9"
toml_edit = "=0.25.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
# Crates that opt in with `[lints] workspace = true` may not use `unsafe`.
# auxesis-kernel-core and auxesis-kernel-broker call libc and do not opt in.
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

# Same as the Auxesis workspace: dependencies (regex, unicode tables) and the
# detector are optimised even in debug, so tests and their linear-time bars
# run at a realistic speed.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.auxesis-kernel-privacy]
opt-level = 2

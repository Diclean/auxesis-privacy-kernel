# First-publish help, for `cargo publish --dry-run` only.
#
# crates.io has no 0.1.0 of these crates yet, so Cargo refuses to package a
# crate whose workspace dependency is not on the registry. These patches point
# crates.io at the workspace copies, which are the same code and version the
# dependencies declare, so the dry-run can build and verify each package end to
# end. They do not affect normal workspace builds (the path dependencies
# already win) and no published package contains this file. Delete this file
# once 0.1.0 is on crates.io.
[patch.crates-io]
kernel-core = { path = "crates/kernel-core" }
gliner2-rs = { path = "crates/gliner2" }
kernel-privacy = { path = "crates/kernel-privacy" }
kernel-net = { path = "crates/kernel-net" }
kernel-broker = { path = "crates/kernel-broker" }
kernel-mcp = { path = "crates/kernel-mcp" }
